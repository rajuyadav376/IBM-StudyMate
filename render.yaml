services:
  - type: web
    name: ibm-studymate
    runtime: node
    rootDir: .
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: IBM_API_KEY
        sync: false
      - key: IBM_PROJECT_ID
        sync: false
      - key: IBM_SERVICE_URL
        value: https://us-south.ml.cloud.ibm.com
      - key: IBM_MODEL_ID
        value: ibm/granite-13b-instruct-v2
      - key: USE_MOCK_AI
        value: "true"
      - key: CLIENT_URL
        sync: false
